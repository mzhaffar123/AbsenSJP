<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AbsenSJP · Karyawan</title>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f7c72" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AbsenSJP" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"
    ></script>
    <script src="/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/">
          <img src="/logosjp.jpeg" alt="Logo" class="brand-logo-img" width="42" height="42" />AbsenSJP
        </a>
        <nav class="nav">
          <a data-page="kiosk" href="/">Absen</a>
          <a class="active" data-page="register" href="/register.html">Karyawan</a>
          <a data-page="jadwal" href="/jadwal.html">Jadwal</a>
          <a data-page="dashboard" href="/dashboard.html">Rekap</a>
          <a data-page="laporan" href="/laporan.html">Laporan</a>
          <a data-page="settings" href="/settings.html">Pengaturan</a>
        </nav>
      </header>
      <section class="page-head">
        <div>
          <div class="eyebrow">Data karyawan</div>
          <h1>Daftarkan wajah.</h1>
          <p>
            Simpan satu wajah per NIP dengan posisi wajah lurus dan pencahayaan
            merata.
          </p>
        </div>
      </section>
      <div class="grid">
        <section class="card camera-card">
          <div class="camera-wrap">
            <video id="registerVideo" muted playsinline></video
            ><canvas id="registerCanvas"></canvas>
            <div class="camera-tip">Kotak hijau menandai wajah terdeteksi</div>
          </div>
          <div
            id="registerStatus"
            class="status"
            style="margin: 14px 5px 0"
          ></div>
        </section>
        <section class="card">
          <form id="registerForm" class="controls">
            <div class="field">
              <label for="nama">Nama lengkap</label
              ><input id="nama" required placeholder="Contoh: Siti Rahma" />
            </div>
            <div class="field">
              <label for="nip">NIP / ID karyawan</label
              ><input id="nip" required placeholder="Contoh: EMP-001" />
            </div>
            <button class="btn btn-primary" type="submit">
              Ambil Wajah & Simpan
            </button>
          </form>
        </section>
      </div>
      <section class="card" style="margin-top: 22px">
        <div class="page-head" style="margin-bottom: 12px">
          <div>
            <div class="eyebrow">Direktori</div>
            <h2>Karyawan terdaftar</h2>
          </div>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Foto</th>
                <th>Nama</th>
                <th>NIP / ID</th>
                <th data-shift-heading>Jadwal Shift</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="employeeRows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
