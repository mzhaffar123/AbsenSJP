<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AbsenSJP · Login Admin</title>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f7c72" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AbsenSJP" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js"></script>
  </head>
  <body>
    <main class="shell" style="min-height: 85vh; display: grid; place-items: center;">
      <div class="card" style="width: 100%; max-width: 420px; padding: 32px 28px;">
        <div style="text-align: center; margin-bottom: 24px;">
          <a class="brand" href="/" style="justify-content: center; margin-bottom: 14px;">
            <img src="/logosjp.jpeg" alt="Logo" class="brand-logo-img" width="42" height="42" />AbsenSJP
          </a>
          <div class="eyebrow" style="margin-bottom: 6px;">Keamanan Sistem</div>
          <h2>Login Administrator</h2>
          <p style="color: var(--muted); font-size: 13px; margin-top: 6px;">
            Masukkan PIN Admin untuk mengakses menu Karyawan, Rekap, dan Pengaturan.
          </p>
        </div>

        <form id="loginForm" class="controls">
          <div class="field">
            <label for="loginPin">PIN Administrator</label>
            <input
              id="loginPin"
              type="password"
              maxlength="20"
              required
              autofocus
              placeholder="Masukkan PIN Admin (Bawaan: 1234)"
              autocomplete="current-password"
            />
          </div>

          <div style="margin-top: 14px; display: grid; gap: 10px;">
            <button class="btn btn-primary" type="submit" style="width: 100%;">
              Masuk sebagai Admin
            </button>
            <a href="/" class="btn btn-secondary" style="text-align: center; text-decoration: none;">
              ← Kembali ke Kiosk Absen
            </a>
          </div>

          <div id="loginStatus" class="status" style="margin-top: 14px; text-align: center;"></div>
        </form>
      </div>
    </main>
  </body>
</html>
